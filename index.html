<!DOCTYPE html>
<html lang="en">

    <title>KBC</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="h-screen bg-cover bg-center flex items-center justify-center relative"
